<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="booking.css">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="nav-brand">
                <a href="index.html" style="text-decoration: none; color: inherit;">
                    <div class="logo-container">
                        <div class="logo">AT</div>
                        <div class="logo-text">
                            <div class="logo-main">Arina Takina</div>
                            <div class="logo-sub">Профессиональный визажист</div>
                        </div>
                    </div>
                </a>
            </div>
            
            <button class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>
            
            <ul class="nav-menu">
                <li><a href="index.html">Главная</a></li>
                <li><a href="services.html">Услуги</a></li>
                <li><a href="portfolio.html">Портфолио</a></li>
                <li><a href="reviews.html">Отзывы</a></li>
                <li><a href="contacts.html">Контакты</a></li>
                <li><a href="booking.html" class="active">Запись</a></li>
            </ul>
        </nav>
    </header>

    <section class="page-header">
        <div class="container">
            <h1>Онлайн запись</h1>
            <p>Выберите удобное время для визита</p>
        </div>
    </section>

    <section class="booking">
        <div class="container">
            <form class="booking-form" action="thank-you.html" method="get">
                <h2>Выберите услугу</h2>
                <div class="service-options">
                    <label class="service-option"><input type="radio" name="service" value="Свадебный макияж" required> Свадебный макияж (от 8 000 ₽)</label>
                    <label class="service-option"><input type="radio" name="service" value="Вечерний макияж"> Вечерний макияж (от 5 500 ₽)</label>
                    <label class="service-option"><input type="radio" name="service" value="Обучение макияжу"> Обучение макияжу (от 20 000 ₽)</label>
                    <label class="service-option"><input type="radio" name="service" value="Express-макияж"> Express-макияж (от 4 000 ₽)</label>
                </div>
                <div class="form-group">
                    <label>Дата:</label>
                    <input type="date" name="date" required>
                </div>
                <div class="form-group">
                    <label>Время:</label>
                    <select name="time" required>
                        <option value="">Выберите время</option>
                        <option value="10:00">10:00</option><option value="12:00">12:00</option><option value="14:00">14:00</option><option value="16:00">16:00</option>
                    </select>
                </div>
                <div class="form-group"><input type="text" name="name" placeholder="Ваше имя" required></div>
                <div class="form-group"><input type="tel" name="phone" placeholder="Телефон" required></div>
                <div class="form-group"><input type="email" name="email" placeholder="Email" required></div>
                <button type="submit" class="btn-primary">Записаться</button>
            </form>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <a href="index.html" style="text-decoration: none; color: inherit;">
                        <div class="logo-container" style="gap: 0.8rem;">
                            <div class="logo" style="width: 40px; height: 40px; font-size: 1rem;">AT</div>
                            <div class="logo-text">
                                <div class="logo-main" style="color: white; font-size: 1.3rem;">Arina Takina</div>
                                <div class="logo-sub" style="color: rgba(255,255,255,0.7);">Визажист • Горно-Алтайск</div>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="footer-links">
                    <a href="contacts.html">Контакты</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Arina Takina. Все права защищены.</p>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
